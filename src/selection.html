<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
  /* The window covers the whole monitor the drag started on; #frame is the selected area. */
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #frame {
    position: absolute; display: none; box-sizing: border-box;
    /* Drawn just outside the area so it never ends up in the screenshot. */
    outline: 2px solid #ff7a1a; outline-offset: 1px; /* the orange accent of theme.css */
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 0 0 9999px rgba(0, 0, 0, 0.18);
  }
  #size {
    position: absolute; display: none; padding: 2px 6px; border-radius: 4px;
    font: 600 11px/1.3 "Segoe UI", system-ui, sans-serif; color: #1f2023; background: #ff7a1a;
  }
</style>
</head>
<body>
<div id="frame"></div>
<div id="size"></div>
<script>
// rect: CSS pixels relative to this window; px: { w, h } real screenshot size in pixels.
selection.onRect(({ rect, px }) => {
  const frame = document.getElementById("frame");
  const size = document.getElementById("size");
  if (!rect) { frame.style.display = size.style.display = "none"; return; }
  Object.assign(frame.style, {
    display: "block", left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.width}px`, height: `${rect.height}px`,
  });
  size.textContent = `${px.w} × ${px.h}`;
  // Label under the area, or inside its bottom edge if there is no room below.
  const below = rect.y + rect.height + 6;
  Object.assign(size.style, {
    display: "block", left: `${rect.x}px`,
    top: `${below + 20 < innerHeight ? below : Math.max(0, rect.y + rect.height - 22)}px`,
  });
});
</script>
</body>
</html>
