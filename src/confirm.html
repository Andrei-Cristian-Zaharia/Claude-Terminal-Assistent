<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
  /* The dictated text before it is sent, in a corner of the screen (config confirm.position). Same
     card as the "Claude finished" notifications (theme.css). Like them it never takes the focus;
     main owns the countdown and handles clicks from the global mouse hook. This page draws, and
     reports where its buttons are. */
  html, body { background: transparent; overflow: hidden; }
  /* Hovering the card pauses the countdown: it lights up like a hovered notification. */
  .paused .card { border-color: var(--accent); background: color-mix(in srgb, var(--surface) 92%, var(--accent)); }
  .card .text { -webkit-line-clamp: 5; }
  .card .text.none { color: var(--muted); font-style: italic; }
  footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .reject-keys { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 11px; }
  footer button { padding: 5px 12px; }
  button.quiet.hover { background: var(--raised); color: var(--ink); }
  #accept { min-width: 96px; font-variant-numeric: tabular-nums; }
  #accept.hover { background: var(--accent-hot); border-color: var(--accent-hot); }
</style>
</head>
<body>
<div class="stack">
  <div class="card">
    <header>
      <span class="lamp" style="--lamp: var(--busy)"></span>
      <span class="label busy" id="label"></span>
      <span class="time" id="extra"></span>
    </header>
    <div class="title" id="title"></div>
    <div class="where" id="where"></div>
    <div class="text" id="text"></div>
    <footer>
      <div class="reject-keys" id="rejectKeys"></div>
      <button class="quiet" id="reject" tabindex="-1">Reject</button>
      <button class="primary" id="accept" tabindex="-1">Accept</button>
    </footer>
    <div class="timer" id="timer"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let total = 3000, endsAt = 0, remaining = 0, raf = 0;

function draw() {
  const left = Math.max(0, endsAt ? endsAt - Date.now() : remaining);
  $("timer").style.transform = `scaleX(${total ? left / total : 0})`;
  $("accept").textContent = `Accept · ${Math.ceil(left / 1000)}s`;
  if (endsAt && left > 0) raf = requestAnimationFrame(draw);
}

toast.onShow((s) => {
  total = s.seconds * 1000;
  remaining = total;
  endsAt = 0;
  cancelAnimationFrame(raf);
  document.body.classList.remove("paused");
  $("label").textContent = s.verb === "Type into" ? "Ready to type" : "Ready to send";
  $("extra").textContent = s.images ? `with ${s.images} image${s.images > 1 ? "s" : ""}` : "";
  $("title").textContent = s.title;
  $("where").textContent = s.where || "";
  $("text").textContent = s.text || "No words, images only";
  $("text").classList.toggle("none", !s.text);
  const keys = $("rejectKeys");
  keys.replaceChildren();
  if (s.rejectKeys?.length) {
    const caps = document.createElement("span");
    caps.className = "keys";
    caps.append(...s.rejectKeys.map((k) => Object.assign(document.createElement("span"), { className: "keycap", textContent: k })));
    keys.append(caps, "rejects");
  }
  for (const b of document.querySelectorAll("button")) b.classList.remove("hover");
  draw();
  requestAnimationFrame(() => {
    const rect = (id) => { const r = $(id).getBoundingClientRect(); return { left: r.left, top: r.top, right: r.right, bottom: r.bottom }; };
    toast.layout({ height: Math.ceil(document.querySelector(".stack").getBoundingClientRect().height), accept: rect("accept"), reject: rect("reject") });
  });
});

toast.onRun(({ remaining: ms }) => {
  document.body.classList.remove("paused");
  endsAt = Date.now() + ms;
  cancelAnimationFrame(raf);
  draw();
});
toast.onPause(({ remaining: ms }) => {
  document.body.classList.add("paused");
  cancelAnimationFrame(raf);
  endsAt = 0;
  remaining = ms;
  draw();
});
toast.onHover((which) => {
  $("accept").classList.toggle("hover", which === "accept");
  $("reject").classList.toggle("hover", which === "reject");
});
</script>
</body>
</html>
